<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>JotaFits</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

header {
  background: white;
  padding: 15px;
  font-weight: bold;
  font-size: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 8px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.nome {
  font-size: 14px;
}

.preco {
  color: red;
  font-weight: bold;
}

a {
  display: block;
  margin-top: 5px;
  text-align: center;
  background: black;
  color: white;
  padding: 6px;
  border-radius: 6px;
  text-decoration: none;
}
</style>

</head>

<body>

<header>JotaFits 🔥</header>

<div class="grid">

  <div class="card">
    <img src="https://via.placeholder.com/300">
    <div class="nome">Produto exemplo</div>
    <div class="preco">R$39,90</div>
    <a href="#">Comprar</a>
  </div>

</div>

</body>
</html>
